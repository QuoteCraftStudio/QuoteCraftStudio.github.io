<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuoteCraft · Conversation</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0e7;color:#173c40;font-family:system-ui}main{max-width:1000px;margin:auto;height:100dvh;min-height:580px;display:flex;flex-direction:column;padding:10px;gap:8px}.panel{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:20px;padding:14px;background:#e4eee7;gap:8px}.panel.other{transform:rotate(180deg);background:#e1ebf1}header{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700}textarea{flex:1;min-height:120px;width:100%;resize:none;border:1px solid #a7bbb4;border-radius:14px;background:#fffefa;color:#152f33;padding:14px;font:500 clamp(28px,5.5vw,48px)/1.25 system-ui}textarea::placeholder{color:#6b7878;font-size:24px}.controls{display:flex;gap:6px;flex-wrap:wrap}button{min-height:44px;border:0;border-radius:10px;padding:9px 14px;background:#176c68;color:white;font:600 16px system-ui}.other button{background:#356a84}button.active{background:#a34431}button.secondary{background:#cbded6;color:#173c40}.status{font-size:13px;min-height:18px;margin:0}.divider{text-align:center;font-size:12px;color:#516966}button:focus-visible,textarea:focus-visible{outline:3px solid #d4922e;outline-offset:2px}@media(max-height:600px){main{min-height:500px}textarea{min-height:80px}} </style></head><body><main><section class="panel other" aria-label="Other person's side"><header><span>Their side</span><span>Speak or type</span></header><textarea id="text1" aria-label="Their message" placeholder="Tap here to type…"></textarea><div class="controls"><button id="mic1">🎙 Speak</button><button id="read1">Read aloud</button><button id="clear1" class="secondary">Clear</button></div><p id="status1" class="status" role="status" aria-live="polite">Your keyboard opens when you tap the message area.</p></section><div class="divider">QUOTECRAFT · FACE-TO-FACE CONVERSATION</div><section class="panel" aria-label="Your side"><header><span>Your side</span><span>Speak or type</span></header><textarea id="text0" aria-label="Your message" placeholder="Tap here to type…"></textarea><div class="controls"><button id="mic0">🎙 Speak</button><button id="read0">Read aloud</button><button id="clear0" class="secondary">Clear</button></div><p id="status0" class="status" role="status" aria-live="polite">Your keyboard opens when you tap the message area.</p></section></main><script>
const $=id=>document.getElementById(id),Speech=window.SpeechRecognition||window.webkitSpeechRecognition;let active=null,rec=null,base='',finished='',speaking=-1;
function status(i,t){$('status'+i).textContent=t}function stop(){if(rec){try{rec.stop()}catch{}}}
function start(i){if(active===i){stop();return}if(active!==null){status(i,'Stop the other microphone first.');return}if(!Speech){status(i,'Speech input is unavailable in this browser. You can type instead.');return}if(window.speechSynthesis)window.speechSynthesis.cancel();active=i;base=$('text'+i).value.trim();finished='';const r=new Speech();rec=r;r.lang='en-CA';r.continuous=true;r.interimResults=true;r.onstart=()=>{$('mic'+i).textContent='■ Stop';$('mic'+i).classList.add('active');status(i,'Listening… words appear as you speak.')};r.onresult=e=>{let interim='';for(let n=e.resultIndex;n<e.results.length;n++){if(e.results[n].isFinal)finished+=(finished?' ':'')+e.results[n][0].transcript;else interim+=e.results[n][0].transcript}const box=$('text'+i);box.value=[base,finished,interim].filter(Boolean).join(' ');box.scrollTop=box.scrollHeight};r.onerror=e=>status(i,'Speech input: '+e.error+'. You can type instead. Microphone access may require HTTPS.');r.onend=()=>{active=null;rec=null;$('mic'+i).textContent='🎙 Speak';$('mic'+i).classList.remove('active');if($('status'+i).textContent.startsWith('Listening'))status(i,'Microphone off. Tap Speak to continue.')};try{r.start()}catch{active=null;rec=null;status(i,'Could not start microphone. Try Chrome on an HTTPS page, or type.')}}
function read(i){const text=$('text'+i).value.trim();if(!text){status(i,'Type a message first.');return}if(!window.speechSynthesis){status(i,'Read-aloud is unavailable in this browser.');return}if(active!==null){status(i,'Stop the microphone before reading aloud.');return}if(speaking===i){window.speechSynthesis.cancel();return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-CA';u.rate=1;u.onstart=()=>{speaking=i;$('read'+i).textContent='Stop audio';status(i,'Reading aloud…')};const done=()=>{speaking=-1;$('read'+i).textContent='Read aloud';status(i,'Ready to speak or type.')};u.onend=done;u.onerror=done;window.speechSynthesis.speak(u)}
for(let i=0;i<2;i++){$('mic'+i).onclick=()=>start(i);$('read'+i).onclick=()=>read(i);$('clear'+i).onclick=()=>{if(active===i){status(i,'Stop the microphone before clearing.');return}$('text'+i).value='';status(i,'Message cleared.');};$('text'+i).addEventListener('focus',()=>{if(active!==null)stop()});if(!Speech)status(i,'Type to communicate. This browser does not support speech input.')}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();if(window.speechSynthesis)window.speechSynthesis.cancel()}});
</script></body></html>
