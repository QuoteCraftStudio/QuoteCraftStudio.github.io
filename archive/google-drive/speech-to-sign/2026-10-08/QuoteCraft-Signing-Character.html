<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuoteCraft · Signing Character Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#173c40;font-family:system-ui;height:100dvh}main{height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px}#word{font-size:clamp(30px,7vw,60px);min-height:1.4em;overflow-wrap:anywhere}canvas{flex:1;min-height:0;max-width:100%;width:600px}#notice{font-size:16px;max-width:750px;min-height:2.6em}button{min-height:64px;min-width:220px;border:0;border-radius:18px;background:#176c68;color:white;font:700 26px system-ui;padding:16px 40px;margin:10px}.on{background:#974731}small{font-size:12px;color:#526c68}a{color:inherit}</style></head><body><main><div id="word">HELLO</div><canvas id="avatar" width="600" height="600" aria-label="Experimental animated signing character"></canvas><div id="notice" role="status">Offline demo: hello → thank you → yes. Tap Speak for live input.</div><button id="mic">Speak</button><small>Experimental motions, not signer-verified. Supports hello / hi, thank you / thanks, yes. Other words appear as text.<br>References: <a href="https://www.lifeprint.com/asl101/pages-signs/h/hello.htm">hello</a> · <a href="https://www.lifeprint.com/asl101/pages-signs/t/thank-you.htm">thank you</a> · <a href="https://www.lifeprint.com/asl101/pages-signs/y/yes.htm">yes</a></small></main><script>
const $=id=>document.getElementById(id);let enabled=false,recognition=null,restart=null,queue=[],playing=false,timer=null,epoch=0;
const canvas=$('avatar'),ctx=canvas.getContext('2d');let motion='hello',began=performance.now(),demo=true,demoIndex=0;const samples=['hello','thank you','yes'];
function notice(t){$('notice').textContent=t}function reset(){clearTimeout(timer);epoch++;queue=[];playing=false;demo=false;motion='idle'}
function add(text){const tokens=text.toLowerCase().replace(/[^a-z\s']/g,' ').trim().split(/\s+/);for(let i=0;i<tokens.length;i++){let word=tokens[i];if(word==='thank'&&tokens[i+1]==='you'){word='thank you';i++}queue.push(word)}if(queue.length>50){queue=queue.slice(-50);notice('Speech is faster than animation; older queued words were dropped.')}play()}
function play(){if(playing||!enabled||!queue.length)return;playing=true;const word=queue.shift(),mine=epoch;motion=word==='hi'?'hello':word==='thanks'?'thank you':word;began=performance.now();$('word').textContent=word.toUpperCase();const supported=['hello','thank you','yes'].includes(motion);if(!supported)motion='idle';notice(supported?'Experimental sign · listening · '+queue.length+' words waiting':'No animation for this word — showing text · listening');timer=setTimeout(()=>{if(mine!==epoch)return;playing=false;motion='idle';play()},supported?2300:1400)}
function line(x,y,a,b,width,color){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke()}function ellipse(x,y,a,b,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,a,b,0,0,Math.PI*2);ctx.fill()}
function hand(x,y,angle,fist,scale){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);const skin='#b87953';if(fist){ctx.fillStyle=skin;ctx.beginPath();ctx.roundRect(-23,-39,46,46,12);ctx.fill();for(let i=0;i<3;i++)line(-13+i*12,-31,-13+i*12,-12,2,'#75462e');line(-20,-3,12,-12,13,skin);line(-20,-3,12,-12,2,'#75462e')}else{ellipse(0,-13,23,32,skin);for(let i=0;i<4;i++){let fx=-17+i*12;line(fx,-24,fx,-70+(i===0?10:i===3?16:0),9,skin)}line(-16,-8,-36,-32,11,skin);for(let i=0;i<3;i++)line(-11+i*12,-37,-11+i*12,-15,1.5,'#875336')}ctx.restore()}
function draw(now){ctx.clearRect(0,0,600,600);let t=Math.min((now-began)/2300,1);if(demo&&t>=1){demoIndex++;if(demoIndex<samples.length){motion=samples[demoIndex];began=now;$('word').textContent=motion.toUpperCase();t=0}else{demo=false;motion='idle';$('word').textContent='Ready to listen';notice('Tap Speak. Try: hello, thank you, yes.')}}
ctx.fillStyle='#176c68';ctx.beginPath();ctx.roundRect(200,245,200,290,70);ctx.fill();ellipse(300,210,29,50,'#b87953');ellipse(300,143,65,83,'#b87953');ellipse(300,96,64,37,'#3e3029');ellipse(277,141,5,6,'#2c2926');ellipse(323,141,5,6,'#2c2926');line(264,123,286,121,4,'#463326');line(313,121,336,123,4,'#463326');line(300,147,294,169,3,'#875336');ctx.strokeStyle='#713f31';ctx.lineWidth=3;ctx.beginPath();ctx.arc(300,174,21,.2,Math.PI-.2);ctx.stroke();line(220,288,167,385,39,'#176c68');line(167,385,199,447,27,'#b87953');hand(205,457,.3,true,1);
let x=411,y=411,angle=.2,fist=false,scale=1;
if(motion==='hello'){x=411+25*Math.sin(t*Math.PI*4);y=173;angle=.25*Math.sin(t*Math.PI*4)}
if(motion==='thank you'){const k=(1-Math.cos(t*Math.PI))/2;x=309+94*k;y=193+48*k;angle=.3*k;scale=1+.45*k}
if(motion==='yes'){x=404;y=291;fist=true;angle=.75*Math.sin(t*Math.PI*4)}
if(motion==='idle'){fist=true;x=404;y=447;angle=-.2}
line(380,288,448,365,38,'#176c68');line(448,365,x,y,27,'#b87953');hand(x,y,angle,fist,scale);requestAnimationFrame(draw)}requestAnimationFrame(draw);
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
function stop(message){enabled=false;clearTimeout(restart);if(recognition){recognition.onend=null;try{recognition.abort()}catch{}recognition=null}reset();$('mic').textContent='Speak';$('mic').classList.remove('on');notice(message||'Microphone off. Tap Speak to start again.')}
function listen(){if(!enabled)return;const r=new Speech();recognition=r;r.lang='en-CA';r.continuous=true;r.interimResults=true;r.onstart=()=>notice('Listening… speak a short phrase.');r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const result=e.results[i];if(result.isFinal)add(result[0].transcript);else if(!playing)$('word').textContent=result[0].transcript}};r.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){stop('Microphone unavailable. Allow microphone access and use Chrome on an HTTPS page.');return}notice(e.error==='no-speech'?'Listening… waiting for speech.':'Speech connection interrupted ('+e.error+').')};r.onend=()=>{recognition=null;if(enabled)restart=setTimeout(listen,600)};try{r.start()}catch{stop('Cannot start speech input. Open this app on an HTTPS page in Chrome.')}}
$('mic').onclick=()=>{if(enabled){stop();return}if(!Speech){notice('This browser does not support speech input. Try Chrome.');return}enabled=true;$('mic').textContent='Stop';$('mic').classList.add('on');listen()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&enabled)stop('Microphone stopped when the app went into the background.')});window.addEventListener('pagehide',()=>stop());

</script></body></html>
